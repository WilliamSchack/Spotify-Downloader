name: Test Build

# Testing, runs when this file has changed
on:
  push:
    branches: [v2]
    paths:
      - '.github/workflows/build.yml'

# Testing to see if building works on all platforms

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                  - os: ubuntu-latest
                    qt_host: linux
                  #- os: windows-latest
                  #  qt_host: windows
                  #- os: macos-latest
                  #  qt_host: mac
        
        name: Building on ${{matrix.os}}
        runs-on: ${{matrix.os}}

        steps:
            - uses: actions/checkout@v4

            # Install Curl
            - name: Install Curl (Linux)
              if: runner.os == 'Linux'
              run: |
                sudo apt-get update
                sudo apt-get install -y libcurl4-openssl-dev
            
            - name: Install Curl (MacOS)
              if: runner.os == 'macOS'
              run: brew install curl

            - name: Install Curl (Windows)
              if: runner.os == 'Windows'
              run: vcpkg install curl

            # Install Qt
            - name: Install Qt (Linux)
              if: runner.os == 'Linux'
              uses: jurplel/install-qt-action@v4
              with:
                version: '6.9.3'
                host: ${{ matrix.qt_host }}
                modules: 'qtwebengine qtwebchannel qtpositioning qtserialport qtwaylandcompositor'
                cache: true

            - name: Install Qt (Windows/MacOS)
              if: runner.os != 'Linux'
              uses: jurplel/install-qt-action@v4
              with:
                version: '6.9.3'
                host: ${{ matrix.qt_host }}
                modules: 'qtwebengine qtwebchannel qtpositioning qtserialport'
                cache: true

            # Configure & Build
            - name: Configure (Linux)
              if: runner.os == 'Linux'
              run: >
                cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
                -DINCLUDE_DEPS=ON
                -DCREATE_APPIMAGE=ON

            - name: Configure (MacOS)
              if: runner.os == 'macOS'
              run: >
                cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
                -DINCLUDE_DEPS=ON
            
            - name: Configure (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: >
                cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
                -DINCLUDE_DEPS=ON
                "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

            - name: Build
              run: cmake --build build --config Release

            # Download dependencies
            - name: Download Dependencies (Windows)
              if: runner.os == 'Windows'
              run: ./build/out/Release/Echolite.exe download-deps

            # Package (Also debugging for now)
            - name: Package (Linux)
              if: runner.os == 'Linux'
              run: |
                wget "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
                chmod +x appimagetool-x86_64.AppImage
                APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
                    ./appimagetool-x86_64.AppImage \
                    build/out/Release
                    build/out/Echolite-x86_64.AppImaeg

            - name: Package (MacOS)
              if: runner.os == 'macOS'
              run: |
                brew install create-dmg
                create-dmg \
                    --volname "Echolite" \
                    --volicon "resources/icons/Icon.icns" \
                    --window-pos 200 100 \
                    --window-size 600 300 \
                    --icon-size 100 \
                    --icon "Echolite.app" 150 120 \
                    --app-drop-link 450 120 \
                    --hide-extension "Echolite.app" \
                    "build/out/Release/Echolite.dmg" \
                    "build/out/Release"
                find build/out/Release

            - name: Package (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: ls -R build/out/Release