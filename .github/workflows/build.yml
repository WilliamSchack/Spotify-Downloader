name: Test Build

# Testing, runs when this file has changed
on:
  push:
    branches: [v2]
    paths:
      - '.github/workflows/build.yml'

# Testing to see if building works on all platforms

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                  - os: ubuntu-latest
                    qt_host: linux
                  - os: windows-latest
                    qt_host: windows
                  #- os: macos-latest
                  #  qt_host: mac
        
        name: Building on ${{matrix.os}}
        runs-on: ${{matrix.os}}

        steps:
            - uses: actions/checkout@v4

            # Install Curl
            - name: Install Curl (Linux)
              if: runner.os == 'Linux'
              run: |
                sudo apt-get update
                sudo apt-get install -y libcurl4-openssl-dev
            
            - name: Install Curl (MacOS)
              if: runner.os == 'macOS'
              run: brew install curl

            - name: Install Curl (Windows)
              if: runner.os == 'Windows'
              run: vcpkg install curl

            # Install Qt
            - name: Install Qt (Linux)
              if: runner.os == 'Linux'
              uses: jurplel/install-qt-action@v4
              with:
                version: '6.9.3'
                host: ${{ matrix.qt_host }}
                modules: 'qtwebengine qtwebchannel qtpositioning qtserialport qtwayland'
                cache: true

            - name: Install Qt (Windows/MacOS)
              if: runner.os != 'Linux'
              uses: jurplel/install-qt-action@v4
              with:
                version: '6.9.3'
                host: ${{ matrix.qt_host }}
                modules: 'qtwebengine qtwebchannel qtpositioning qtserialport'
                cache: true

            # Configure & Build
            - name: Configure (Linux/MacOS)
              if: runner.os != 'Windows'
              run: >
                cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
                -DINCLUDE_DEPS=ON
            
            - name: Configure (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: >
                cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
                -DINCLUDE_DEPS=ON
                "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

            - name: Build
              run: cmake --build build --config Release

            # Doing nothing at the moment with it, just testing if its working