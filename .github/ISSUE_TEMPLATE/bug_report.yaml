name: Bug report
description: Create a report to help improve Spotify Downloader
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Please provide all fields with the required (*) icon
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I am using the latest version as listed [here](https://github.com/WilliamSchack/Spotify-Downloader/releases/latest)
          required: true
  - type: textarea
    id: description
    attributes:
      label: Provide a description of what the bug is
      placeholder: Provide any information and suggested solutions with as much context and detail as possible
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Provide steps to reproduce the bug
      description: Please provide the spotify link used here if related to downloading
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Complete Log
      description: |
        You can find your most recent log by going into the app, then the Settings screen, and at the bottom there is a Open Logs Folder button
        Please drag and drop Log.log and PreviousLog.log (If it exists) into the below text box. If thats not possible, copy the contents instead. The logs should start like the following:
      placeholder: |
        Please drag and drop the log files as described above, or copy the log contents which should start like the following:

        [2026-11-18 11:14:38 | INFO] Running version 2.0.0 on <arch> <os>
        [2026-11-18 11:14:38 | INFO] Loaded the config from (<path>/Config.json): { <settings> }
        <continues from here>
    validations:
      required: true
